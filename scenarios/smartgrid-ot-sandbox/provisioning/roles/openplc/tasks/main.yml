---
- name: Install dependencies for compiling OpenPLC V3
  apt:
    name: [git, autoconf, libtool, make, g++, sqlite3, libsqlite3-dev, python3-pip]
    state: present
    update_cache: true

- name: Install pymodbus via pip
  pip:
    name: pymodbus
    executable: pip3
    extra_args: --break-system-packages
  ignore_errors: true

- name: Clone OpenPLC V3 repository
  git:
    repo: 'https://github.com/thiagoralves/OpenPLC_v3.git'
    dest: /opt/OpenPLC_v3
    version: master

- name: Deploy Substation ST program
  copy:
    src: smartgrid_substation.st
    dest: /opt/OpenPLC_v3/webserver/st_files/smartgrid_substation.st
    owner: root
    group: root
    mode: '0644'

- name: Run OpenPLC installer (non-interactive)
  shell: ./install.sh linux
  args:
    chdir: /opt/OpenPLC_v3
    creates: /opt/OpenPLC_v3/start_openplc.sh

- name: Configure OpenPLC systemd service
  copy:
    dest: /etc/systemd/system/openplc.service
    content: |
      [Unit]
      Description=OpenPLC Runtime Service
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/OpenPLC_v3
      ExecStart=/opt/OpenPLC_v3/start_openplc.sh
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Configure OpenPLC selected program to smartgrid_substation.st
  command: sqlite3 /opt/OpenPLC_v3/webserver/openplc.db "UPDATE settings SET value = 'smartgrid_substation.st' WHERE key = 'Selected_prog';"

- name: Enable Modbus TCP port 502 on OpenPLC
  command: sqlite3 /opt/OpenPLC_v3/webserver/openplc.db "UPDATE settings SET value = '502' WHERE key = 'Modbus_port';"

- name: Enable automatic run mode on OpenPLC
  command: sqlite3 /opt/OpenPLC_v3/webserver/openplc.db "UPDATE settings SET value = 'true' WHERE key = 'Start_run_mode';"


- name: Enable systemd service and restart OpenPLC
  systemd:
    name: openplc
    daemon_reload: true
    state: restarted
    enabled: true
